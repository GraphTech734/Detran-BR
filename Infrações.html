    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(to right, #006400, #008000, #32CD32, #ADFF2F);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Garante que o corpo ocupe no mínimo 100% da altura da viewport */
        }

        .main-content { 
            flex: 1; /* Faz o contêiner crescer e preencher o espaço disponível */ 
            display: flex; justify-content: center; /* Centraliza o contêiner horizontalmente */ 
            align-items: center; /* Centraliza o contêiner verticalmente */ 
            text-align: center; 
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
        }
        .voltar {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .voltar a {
            color: #fff;
            font-size: 1.5rem;
            text-decoration: none;
            transition: transform 0.3s;
        }
        .voltar a:hover {
            transform: scale(1.1);
        }
        h1 {
            margin: 10px 0;
            font-weight: 600;
        }
        .frase {
            font-size: 1rem;
            margin: 15px 0;
            color: #f0f0f0;
        }
        select, button {
            font-size: 1rem;
            padding: 10px 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            outline: none;
            width: 100%;
        }
        select {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
        }
        button {
            background: #00ff88;
            color: black;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 700;
        }
        button:hover {
            background: #02f860;
        }
        button:active {
            transform: scale(0.95);
        }

        select option {
            background-color: #f0f8ff; /* Cor de fundo do dropdown */
            color: black;          /* Cor do texto */
        }

        footer { 
            background: linear-gradient(to right, #006400, #008000, #32CD32, #ADFF2F);
            color: #ccc; /* Cor cinza clara */ 
            justify-content: center; 
            align-items: center; 
            display: flex;
            width: 100%;
            margin-top: auto;
                 
            }
